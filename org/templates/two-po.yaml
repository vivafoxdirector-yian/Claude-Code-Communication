# PO 를 둘로 늘린 조직도 — 영역 분할 예시.
#
# org/templates/product-team.yaml 과 다른 곳은 기획부뿐이다. 스크립트는 손대지 않았다.
# 멤버 한 줄을 더 쓰면 tmux 자리가 늘고 보고선이 잡힌다.
#
#   ./aiorg up --org org/templates/two-po.yaml
#
# 둘 이상일 때 반드시 지켜야 할 것: 제품 영역을 겹치지 않게 나눈다.
# 엔지니어에게 파일 범위를 주는 것과 같은 이유다. 경계가 없으면 두 PO 가
# 같은 기능을 다르게 기획하고, 개발팀은 어느 쪽을 만들지 알 수 없다.
#
# 셋 이상이면 여기에 기획팀장(role: manager)을 두고 PO 들이 그에게 보고하게 한다.
# 그때부터 팀장이 제안을 종합해 대표에게 올린다.

version: 1

org:
  name: "AI Dev Corp (기획 2인)"
  description: "8명. PO 2인이 제품 영역을 나눠 맡는 형태."
  workdir: "."
  session_prefix: aiorg
  layout: windows

roles:
  ceo:
    instruction: org/roles/ceo.md
    icon: "\U0001F451"
    color: magenta
    can_assign: true

  manager:
    instruction: org/roles/manager.md
    icon: "\U0001F3AF"
    color: red
    can_assign: true

  engineer:
    instruction: org/roles/engineer.md
    icon: "\U0001F527"
    color: blue
    can_assign: false

  reviewer:
    instruction: org/roles/reviewer.md
    icon: "\U0001F50D"
    color: cyan
    can_assign: false

  po:
    instruction: org/roles/po.md
    icon: "\U0001F4CB"
    color: yellow
    can_assign: false
    # skills 가 담당 제품 영역이므로 겹치면 경고한다. 아래 두 PO 는 겹치지 않는다.
    exclusive_skills: true

members:
  - id: ceo
    title: "대표"
    role: ceo
    session: exec

  # ---- 기획부 ----
  # skills 가 곧 담당 영역이다. PO 는 자기 영역 밖을 제안하지 않는다.
  # 영역이 걸치는 제안은 서로 맞춘 뒤 한 사람이 대표해서 올린다.
  #
  # 아래 둘은 전부 "기능 영역" 이라는 하나의 축으로만 나눴다. 이게 중요하다.
  # 축을 섞으면(예: 한쪽은 기능, 다른 쪽은 플랫폼) 반드시 빈틈이나 겹침이 생긴다.
  # "모바일 인증" 은 기능 담당인가 플랫폼 담당인가 — 답할 수 없게 된다.
  #
  # 그리고 '제품기획', '요구사항정의', '사용자리서치' 같은 것은 여기 쓰지 않는다.
  # 그건 모든 PO 가 하는 일이라 담당을 나누는 기준이 못 된다.
  - id: po-account
    title: "제품 책임자 (계정·권한)"
    role: po
    reports_to: ceo
    session: product
    skills: [인증, 사용자관리, 권한, 설정]

  - id: po-billing
    title: "제품 책임자 (결제·알림)"
    role: po
    reports_to: ceo
    session: product
    skills: [결제, 정산, 구독, 알림]

  # ---- 개발부 ----
  - id: dev-lead
    title: "개발팀장"
    role: manager
    reports_to: ceo
    session: dev

  - id: dev-1
    title: "백엔드 개발자"
    role: engineer
    reports_to: dev-lead
    session: dev
    skills: [backend, python, api, db]

  - id: dev-2
    title: "프론트엔드 개발자"
    role: engineer
    reports_to: dev-lead
    session: dev
    skills: [frontend, typescript, ui]

  # ---- 품질부 ----
  - id: qa-lead
    title: "품질팀장"
    role: manager
    reports_to: ceo
    session: qa

  - id: qa-1
    title: "코드 리뷰어"
    role: reviewer
    reports_to: qa-lead
    session: qa
    skills: [review, testing, security]
