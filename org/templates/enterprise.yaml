# 대규모 조직 — 4계층, 부서 5개, 14명.
#
# 개발을 백엔드/프론트 두 팀으로 나누고, 기획부에 팀장을 두고,
# 사업부는 고객군으로 프리세일즈를 나눈 형태다.
#
# 주의: 14개 Claude 세션이 각자 컨텍스트를 유지한다. 토큰 소비가 크다.
# 실제로 이만한 조직이 필요한지 먼저 생각해 보는 편이 좋다.
# 대개는 product-team(8명)으로 충분하고, 병목이 보일 때 그 부분만 늘리면 된다.
#
#   ./aiorg up --org enterprise

version: 1

org:
  name: "AI Org (enterprise)"
  description: "14명 4계층. 개발 2팀, 기획팀장, 고객군별 프리세일즈."
  workdir: "."
  session_prefix: aiorg
  layout: windows

  # 산출물 자리. 구성원이 문서를 어디에 남길지 정한다.
  # 정의하지 않으면 각자 자리를 발명한다 — 실제로 그런 일이 있었다.
  # when: decision 은 결정 시점에만 쓸 수 있다는 뜻이다 (사후 작성은 재구성이다).
  artifacts:
    design: { path: docs/design/, desc: "기술 설계 — 무엇을 어떻게 만들 것인가" }
    adr: { path: docs/adr/, when: decision, desc: "기술 선택 기록 — 왜 이걸 골랐는가" }
    qa: { path: docs/qa/, desc: "테스트 계획·검증 시나리오" }
    plan: { path: docs/plan/, desc: "작업 분해와 순서" }

roles:
  ceo:
    instruction: org/roles/ceo.md
    icon: "\U0001F451"
    color: magenta
    can_assign: true

  manager:
    instruction: org/roles/manager.md
    icon: "\U0001F3AF"
    color: red
    can_assign: true
    use_skills: [architecture-decision]

  engineer:
    instruction: org/roles/engineer.md
    icon: "\U0001F527"
    color: blue
    can_assign: false
    use_skills: [clean-architecture-design, design-patterns]

  reviewer:
    instruction: org/roles/reviewer.md
    icon: "\U0001F50D"
    color: cyan
    can_assign: false
    use_skills: [python-code-review, security-review]

  # 기획(PO) — 무엇을 만들지 판단해 대표에게 제안한다.
  # can_assign 이 false 인 것이 이 역할의 핵심이다. PO 는 개발팀에 지휘권이 없다.
  # 제안만 하고, 채택과 배정은 대표가 한다. 실제 회사의 PO 와 같다.
  po:
    instruction: org/roles/po.md
    icon: "\U0001F4CB"
    color: yellow
    can_assign: false
    # PO 의 skills 는 기술 역량이 아니라 담당 제품 영역이다.
    # 엔지니어 둘이 python 을 함께 하는 건 정상이지만, PO 둘이 같은 영역을 들면
    # 같은 기능을 다르게 기획하게 되고 개발팀은 어느 쪽을 만들지 알 수 없다.
    # 이 값을 켜두면 up 이 겹침을 잡아 경고한다.
    exclusive_skills: true

  # 프리세일즈 — 제품과 고객 사이를 양방향으로 나른다.
  # 밖으로: 영업 자료. 안으로: VOC(고객의 목소리).
  # PO 와 마찬가지로 지휘권이 없다. VOC 는 입력이지 결정이 아니다.
  # skills 는 담당 고객군이므로 겹치면 경고한다.
  presales:
    instruction: org/roles/presales.md
    icon: "\U0001F4E3"
    color: green
    can_assign: false
    exclusive_skills: true


members:
  - id: ceo
    title: "대표"
    role: ceo
    session: exec

  # ---- 기획부 ----
  - id: po-lead
    title: "기획팀장"
    role: manager
    reports_to: ceo
    session: product

  - id: po-account
    title: "제품 책임자 (계정·권한)"
    role: po
    reports_to: po-lead
    session: product
    skills: [인증, 사용자관리, 권한, 설정]

  - id: po-billing
    title: "제품 책임자 (결제·알림)"
    role: po
    reports_to: po-lead
    session: product
    skills: [결제, 정산, 구독, 알림]

  # ---- 백엔드팀 ----
  - id: be-lead
    title: "백엔드팀장"
    role: manager
    reports_to: ceo
    session: backend

  - id: be-1
    title: "백엔드 개발자 A"
    role: engineer
    reports_to: be-lead
    session: backend
    skills: [python, api, db]

  - id: be-2
    title: "백엔드 개발자 B"
    role: engineer
    reports_to: be-lead
    session: backend
    skills: [python, 배치, 연동]

  # ---- 프론트팀 ----
  - id: fe-lead
    title: "프론트팀장"
    role: manager
    reports_to: ceo
    session: frontend

  - id: fe-1
    title: "프론트 개발자"
    role: engineer
    reports_to: fe-lead
    session: frontend
    # 프론트 담당에게만 얹는다. 역할(engineer)이 주는 스킬에 더해진다.
    use_skills: [frontend-design]
    skills: [typescript, ui, 상태관리]

  # ---- 품질부 ----
  - id: qa-lead
    title: "품질팀장"
    role: manager
    reports_to: ceo
    session: qa

  - id: qa-1
    title: "코드 리뷰어 (정확성)"
    role: reviewer
    reports_to: qa-lead
    session: qa
    skills: [정확성, 경계조건, 테스트]

  - id: qa-2
    title: "코드 리뷰어 (보안)"
    role: reviewer
    reports_to: qa-lead
    session: qa
    skills: [보안, 인증, 데이터보호]

  # ---- 사업부 ----
  # 프리세일즈가 둘이면 고객군으로 나눈다. 축은 하나로 통일한다(여기서는 산업군).
  - id: presales-fin
    title: "프리세일즈 (금융)"
    role: presales
    reports_to: ceo
    session: biz
    skills: [금융, 보험]

  - id: presales-pub
    title: "프리세일즈 (공공)"
    role: presales
    reports_to: ceo
    session: biz
    skills: [공공, 교육]
