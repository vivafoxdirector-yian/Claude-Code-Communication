# research 조직에 개발부를 붙인 형태 — 기획에서 개발로 넘어갈 때.
#
# research 로 조사·기획을 마쳤다면, 조직을 갈아끼우지 말고 이걸로 올린다.
#
#   ./aiorg down
#   ./aiorg up --org research-build
#
# 핵심은 **기획부 멤버 id 가 research 와 똑같다**는 것이다 (po-lead, po-market,
# po-product, presales). id 가 같으면 그들의 태스크와 수신함이 그대로 이어진다.
# 조직을 교체하면(예: product-team 으로) 담당자가 사라져 진행 중이던 일이
# 고아가 된다. up 이 경고해 주지만, 애초에 그럴 일을 만들지 않는 편이 낫다.
#
# 넘어간 뒤 하는 일:
#   1. 대표가 기획 산출물(docs/product/specs/)을 근거로 개발팀장에게 배정한다
#   2. 개발자가 요구사항 정의서를 읽고 만든다
#   3. 요구사항이 모호하면 개발자가 담당 PO 에게 직접 질문한다 (수평 질문은 허용된다)

version: 1

org:
  name: "AI Org (research → build)"
  description: "10명. research 조직에 개발·품질부를 붙인 형태. 기획 멤버 id 유지."
  workdir: "."
  session_prefix: aiorg
  layout: windows

  # 산출물 자리. 구성원이 문서를 어디에 남길지 정한다.
  # 정의하지 않으면 각자 자리를 발명한다 — 실제로 그런 일이 있었다.
  # when: decision 은 결정 시점에만 쓸 수 있다는 뜻이다 (사후 작성은 재구성이다).
  artifacts:
    design: { path: docs/design/, desc: "기술 설계 — 무엇을 어떻게 만들 것인가" }
    adr: { path: docs/adr/, when: decision, desc: "기술 선택 기록 — 왜 이걸 골랐는가" }
    qa: { path: docs/qa/, desc: "테스트 계획·검증 시나리오" }
    plan: { path: docs/plan/, desc: "작업 분해와 순서" }

roles:
  ceo:
    instruction: org/roles/ceo.md
    icon: "\U0001F451"
    color: magenta
    can_assign: true

  manager:
    instruction: org/roles/manager.md
    icon: "\U0001F3AF"
    color: red
    can_assign: true
    use_skills: [architecture-decision]

  engineer:
    instruction: org/roles/engineer.md
    icon: "\U0001F527"
    color: blue
    can_assign: false
    use_skills: [clean-architecture-design, design-patterns]

  reviewer:
    instruction: org/roles/reviewer.md
    icon: "\U0001F50D"
    color: cyan
    can_assign: false
    use_skills: [python-code-review, security-review]

  # 기획(PO) — 무엇을 만들지 판단해 대표에게 제안한다.
  # can_assign 이 false 인 것이 이 역할의 핵심이다. PO 는 개발팀에 지휘권이 없다.
  # 제안만 하고, 채택과 배정은 대표가 한다. 실제 회사의 PO 와 같다.
  po:
    instruction: org/roles/po.md
    icon: "\U0001F4CB"
    color: yellow
    can_assign: false
    # PO 의 skills 는 기술 역량이 아니라 담당 제품 영역이다.
    # 엔지니어 둘이 python 을 함께 하는 건 정상이지만, PO 둘이 같은 영역을 들면
    # 같은 기능을 다르게 기획하게 되고 개발팀은 어느 쪽을 만들지 알 수 없다.
    # 이 값을 켜두면 up 이 겹침을 잡아 경고한다.
    exclusive_skills: true

  # 프리세일즈 — 제품과 고객 사이를 양방향으로 나른다.
  # 밖으로: 영업 자료. 안으로: VOC(고객의 목소리).
  # PO 와 마찬가지로 지휘권이 없다. VOC 는 입력이지 결정이 아니다.
  # skills 는 담당 고객군이므로 겹치면 경고한다.
  presales:
    instruction: org/roles/presales.md
    icon: "\U0001F4E3"
    color: green
    can_assign: false
    exclusive_skills: true


members:
  - id: ceo
    title: "대표"
    role: ceo
    session: exec

  # ---- 기획부 ---- (research 와 id·구성이 동일하다. 그래서 일이 이어진다)
  - id: po-lead
    title: "기획팀장"
    role: manager
    reports_to: ceo
    session: product

  - id: po-market
    title: "제품 책임자 (시장)"
    role: po
    reports_to: po-lead
    session: product
    skills: [시장조사, 경쟁분석, 가격]

  - id: po-product
    title: "제품 책임자 (기능)"
    role: po
    reports_to: po-lead
    session: product
    skills: [기능정의, 사용자경험, 로드맵]

  # ---- 개발부 ---- (여기부터가 새로 붙은 부분)
  - id: dev-lead
    title: "개발팀장"
    role: manager
    reports_to: ceo
    session: dev

  - id: dev-1
    title: "백엔드 개발자"
    role: engineer
    reports_to: dev-lead
    session: dev
    skills: [backend, python, api, db]

  - id: dev-2
    title: "프론트엔드 개발자"
    role: engineer
    reports_to: dev-lead
    session: dev
    # 프론트 담당에게만 얹는다. 역할(engineer)이 주는 스킬에 더해진다.
    use_skills: [frontend-design]
    skills: [frontend, typescript, ui]

  # ---- 품질부 ----
  - id: qa-lead
    title: "품질팀장"
    role: manager
    reports_to: ceo
    session: qa

  - id: qa-1
    title: "코드 리뷰어"
    role: reviewer
    reports_to: qa-lead
    session: qa
    skills: [review, testing, security]

  # ---- 사업부 ----
  - id: presales
    title: "프리세일즈"
    role: presales
    reports_to: ceo
    session: biz
    skills: [고객전반]
