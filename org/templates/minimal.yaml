# 최소 조직 — 기존 데모(PRESIDENT → boss1 → workers)와 같은 3계층.
# 프레임워크를 처음 돌려볼 때 이걸로 시작하면 세션이 하나만 뜬다.
#
#   ./aiorg up --org org/templates/minimal.yaml

version: 1

org:
  name: "AI Org (minimal)"
  description: "4명 1세션. 3계층 기본형, 처음 돌려볼 때."
  workdir: "."
  session_prefix: aiorg

  # 산출물 자리. 구성원이 문서를 어디에 남길지 정한다.
  # 정의하지 않으면 각자 자리를 발명한다 — 실제로 그런 일이 있었다.
  # when: decision 은 결정 시점에만 쓸 수 있다는 뜻이다 (사후 작성은 재구성이다).
  artifacts:
    design: { path: docs/design/, desc: "기술 설계 — 무엇을 어떻게 만들 것인가" }
    ui: { path: docs/design/ui/, desc: "화면 설계 — 어떤 화면이 어떻게 생기고 왜 그런가" }
    adr: { path: docs/adr/, when: decision, desc: "기술 선택 기록 — 왜 이걸 골랐는가" }
    qa: { path: docs/qa/, desc: "테스트 계획·검증 시나리오" }
    plan: { path: docs/plan/, desc: "작업 분해와 순서" }

roles:
  ceo:
    instruction: org/roles/ceo.md
    icon: "\U0001F451"
    color: magenta
    can_assign: true
  manager:
    instruction: org/roles/manager.md
    icon: "\U0001F3AF"
    color: red
    can_assign: true
  engineer:
    instruction: org/roles/engineer.md
    icon: "\U0001F527"
    color: blue
    use_skills: [clean-architecture-design, design-patterns]

members:
  - id: ceo
    title: "대표"
    role: ceo
    session: org

  - id: lead
    title: "팀장"
    role: manager
    reports_to: ceo
    session: org

  - id: w1
    title: "실무자 A"
    role: engineer
    reports_to: lead
    session: org

  - id: w2
    title: "실무자 B"
    role: engineer
    reports_to: lead
    session: org
