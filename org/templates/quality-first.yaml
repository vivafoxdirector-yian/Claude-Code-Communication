# 품질 우선형 — 리뷰 인력을 개발 인력만큼 둔다.
#
# 개발자 2 : 리뷰어 2. 모든 산출물이 리뷰를 거치도록 설계한 조직이다.
# 개발자는 완료 시 done 이 아니라 review 로 넘기고, 리뷰 통과 후에 done 이 된다.
# 속도보다 정확성이 중요한 일(결제, 인증, 마이그레이션)에 쓴다.
#
#   ./aiorg up --org quality-first

version: 1

org:
  name: "AI Org (quality-first)"
  description: "리뷰어 2명. 모든 산출물이 리뷰를 거치는 조직."
  workdir: "."
  session_prefix: aiorg
  layout: windows

  # 산출물 자리. 구성원이 문서를 어디에 남길지 정한다.
  # 정의하지 않으면 각자 자리를 발명한다 — 실제로 그런 일이 있었다.
  # when: decision 은 결정 시점에만 쓸 수 있다는 뜻이다 (사후 작성은 재구성이다).
  artifacts:
    design: { path: docs/design/, desc: "기술 설계 — 무엇을 어떻게 만들 것인가" }
    adr: { path: docs/adr/, when: decision, desc: "기술 선택 기록 — 왜 이걸 골랐는가" }
    qa: { path: docs/qa/, desc: "테스트 계획·검증 시나리오" }
    plan: { path: docs/plan/, desc: "작업 분해와 순서" }

roles:
  ceo:
    instruction: org/roles/ceo.md
    icon: "\U0001F451"
    color: magenta
    can_assign: true

  manager:
    instruction: org/roles/manager.md
    icon: "\U0001F3AF"
    color: red
    can_assign: true
    use_skills: [architecture-decision]

  engineer:
    instruction: org/roles/engineer.md
    icon: "\U0001F527"
    color: blue
    can_assign: false
    use_skills: [clean-architecture-design, design-patterns]

  reviewer:
    instruction: org/roles/reviewer.md
    icon: "\U0001F50D"
    color: cyan
    can_assign: false
    use_skills: [python-code-review, security-review]

  # 기획(PO) — 무엇을 만들지 판단해 대표에게 제안한다.
  # can_assign 이 false 인 것이 이 역할의 핵심이다. PO 는 개발팀에 지휘권이 없다.
  # 제안만 하고, 채택과 배정은 대표가 한다. 실제 회사의 PO 와 같다.
  po:
    instruction: org/roles/po.md
    icon: "\U0001F4CB"
    color: yellow
    can_assign: false
    # 비용은 제품 결정의 한 축이다. 자료는 docs/finops/raw/ 에서만 온다.
    use_skills: [cloud-finops]
    # PO 의 skills 는 기술 역량이 아니라 담당 제품 영역이다.
    # 엔지니어 둘이 python 을 함께 하는 건 정상이지만, PO 둘이 같은 영역을 들면
    # 같은 기능을 다르게 기획하게 되고 개발팀은 어느 쪽을 만들지 알 수 없다.
    # 이 값을 켜두면 up 이 겹침을 잡아 경고한다.
    exclusive_skills: true

  # 프리세일즈 — 제품과 고객 사이를 양방향으로 나른다.
  # 밖으로: 영업 자료. 안으로: VOC(고객의 목소리).
  # PO 와 마찬가지로 지휘권이 없다. VOC 는 입력이지 결정이 아니다.
  # skills 는 담당 고객군이므로 겹치면 경고한다.
  presales:
    instruction: org/roles/presales.md
    icon: "\U0001F4E3"
    color: green
    can_assign: false
    exclusive_skills: true


members:
  - id: ceo
    title: "대표"
    role: ceo
    session: exec

  - id: po
    title: "제품 책임자"
    role: po
    reports_to: ceo
    session: exec
    skills: [제품전반]

  # ---- 개발부 ----
  - id: dev-lead
    title: "개발팀장"
    role: manager
    reports_to: ceo
    session: dev

  - id: dev-1
    title: "개발자 A"
    role: engineer
    reports_to: dev-lead
    session: dev
    skills: [backend, api, db]

  - id: dev-2
    title: "개발자 B"
    role: engineer
    reports_to: dev-lead
    session: dev
    # 프론트 담당에게만 얹는다. 역할(engineer)이 주는 스킬에 더해진다.
    use_skills: [frontend-design]
    skills: [frontend, ui]

  # ---- 품질부 ----
  # 리뷰어가 둘이다. skills 로 검토 영역을 나눠 두 사람이 같은 것을 두 번 보지 않게 한다.
  # 리뷰어의 skills 는 역량이라 겹쳐도 되지만, 여기서는 분담 표시로 쓴다.
  - id: qa-lead
    title: "품질팀장"
    role: manager
    reports_to: ceo
    session: qa

  - id: qa-1
    title: "코드 리뷰어 (정확성)"
    role: reviewer
    reports_to: qa-lead
    session: qa
    skills: [정확성, 경계조건, 테스트]

  - id: qa-2
    title: "코드 리뷰어 (보안)"
    role: reviewer
    reports_to: qa-lead
    session: qa
    skills: [보안, 인증, 데이터보호]
